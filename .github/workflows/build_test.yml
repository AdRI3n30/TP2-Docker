name: Build and Test Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v4
     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3
     - name: Build image for scanning Python
       run: docker build -t my-app-python:1.0.0 -f ./api/Dockerfile .
     - name: Build image for scanning Mongo
       run: |
         cd MongoDB
         docker build -t my-app-mongo:1.0.0 -f ./Dockerfile .
     - name: Login to Docker Hub
       uses: docker/login-action@v4
       with:
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_TOKEN}}
     - name: Docker Scout Scan Python
       uses: docker/scout-action@v1
       with:
         command: recommendations
         image: my-app-python:1.0.0
         file: ./api/Dockerfile
         only-severities: criticals,high
         exit-code: false
     - name: Docker Scout Scan Mongo
       uses: docker/scout-action@v1
       with:
         command: recommendations
         image: my-app-mongo:1.0.0
         file: ./MongoDB/Dockerfile
         only-severities: criticals,high
         exit-code: false

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Trivy Scan MySQL image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mysql:8.0
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  integration-test:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}" >> .env
          echo "MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}" >> .env
          echo "MONGO_INITDB_DATABASE=${{ secrets.MONGO_INITDB_DATABASE }}" >> .env
          echo "ME_CONFIG_MONGODB_ADMINUSERNAME=${{ secrets.ME_CONFIG_MONGODB_ADMINUSERNAME }}" >> .env
          echo "ME_CONFIG_MONGODB_ADMINPASSWORD=${{ secrets.ME_CONFIG_MONGODB_ADMINPASSWORD }}" >> .env
          echo "ME_CONFIG_MONGODB_URL=${{ secrets.ME_CONFIG_MONGODB_URL }}" >> .env

      - name: Deploy stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for all services to be healthy..."
          MAX_WAIT=300
          WAIT=0
          SLEEP=10

          until [ $WAIT -ge $MAX_WAIT ]; do
            PENDING=$(docker compose ps | grep -cE "(starting|unhealthy)" || true)
            if [ "$PENDING" -eq "0" ]; then
              echo "All services ready after ${WAIT}s"
              docker compose ps
              exit 0
            fi
            echo "Services still pending: $PENDING (${WAIT}s / ${MAX_WAIT}s)"
            sleep $SLEEP
            WAIT=$((WAIT + SLEEP))
          done

          echo "ERROR: Timeout after ${MAX_WAIT}s - services not healthy"
          docker compose ps
          docker compose logs
          exit 1

      - name: Test /posts route
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/posts)
          echo "GET /posts -> HTTP $HTTP_CODE"
          [ "$HTTP_CODE" -eq 200 ] || { echo "FAILED: expected 200, got $HTTP_CODE"; exit 1; }

      - name: Test /users route
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/users)
          echo "GET /users -> HTTP $HTTP_CODE"
          [ "$HTTP_CODE" -eq 200 ] || { echo "FAILED: expected 200, got $HTTP_CODE"; exit 1; }

  publish:
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-app-python:latest

      - name: Build and push MongoDB image
        uses: docker/build-push-action@v6
        with:
          context: ./MongoDB
          file: ./MongoDB/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-app-mongo:latest
