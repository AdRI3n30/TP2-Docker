name: Build and Test Application

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v4
     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3
     - name: Build image for scanning Python
       run: docker build -t my-app-python:1.0.0 -f ./api/Dockerfile .
     - name: Build image for scanning Mongo 
       run: |
         cd MongoDB
         docker build -t my-app-mongo:1.0.0 -f ./Dockerfile .
     - name: Login to Docker Hub
       uses: docker/login-action@v4
       with:
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_TOKEN}}
     - name: Docker Scout Scan Python
       uses: docker/scout-action@v1
       with:
         command: cves, recommendations
         image: my-app-python:1.0.0
         file: ./api/Dockerfile
         only-severities: criticals,high
         exit-code: true
     - name: Docker Scout Scan Mongo
       uses: docker/scout-action@v1
       with:
         command: cves, recommendations
         image: my-app-mongo:1.0.0
         file: ./MongoDB/Dockerfile
         only-severities: criticals,high
         exit-code: true    
         
           
    
    
    

    
