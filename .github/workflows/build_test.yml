name: Build and Test Application

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v4
     - name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v3
     - name: Build image for scanning Python
       run: docker build -t my-app-python:1.0.0 -f ./api/Dockerfile .
     - name: Build image for scanning Mongo 
       run: |
         cd MongoDB
         docker build -t my-app-mongo:1.0.0 -f ./Dockerfile .
     - name: Login to Docker Hub
       uses: docker/login-action@v4
       with:
         username: ${{secrets.DOCKERHUB_USERNAME}}
         password: ${{secrets.DOCKERHUB_TOKEN}}
     - name: Docker Scout Scan Python
       uses: docker/scout-action@v1
       with:
         command: recommendations
         image: my-app-python:1.0.0
         file: ./api/Dockerfile
         only-severities: criticals,high
         exit-code: false
     - name: Docker Scout Scan Mongo
       uses: docker/scout-action@v1
       with:
         command: recommendations
         image: my-app-mongo:1.0.0
         file: ./MongoDB/Dockerfile
         only-severities: criticals,high
         exit-code: false

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Trivy Scan MySQL image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mysql:8.0
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

  docker-compose:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Wait for Services (Healthcheck)
        shell: bash
        run: |
          MAX_RETRIES=12
          DELAY=5
          COUNT=0
          
          echo "Démarrage de la vérification de santé..."

          while [ $COUNT -lt $MAX_RETRIES ]; do
            # 1. On récupère tous les états de santé
            # On utilise -s pour 'slurp' au cas où Docker renvoie plusieurs objets JSON séparés
            HEALTH_STATES=$(docker compose ps --format json | jq -s -r '.[] | .Health')
            
            # 2. On compte combien ne sont PAS "healthy"
            # On vérifie si "healthy" est absent ou si c'est vide/starting
            NOT_HEALTHY_COUNT=$(echo "$HEALTH_STATES" | grep -v "healthy" | wc -l)
            
            # 3. On vérifie aussi qu'on a bien reçu des données (évite les faux positifs)
            if [ -n "$HEALTH_STATES" ] && [ "$NOT_HEALTHY_COUNT" -eq 0 ]; then
              echo "Tous les services sont healthy !"
              docker compose ps
              exit 0
            fi
            
            echo "Attempt $((COUNT+1))/$MAX_RETRIES: Services en cours de démarrage..."
            sleep $DELAY
            COUNT=$((COUNT+1))
          done
          
          echo "❌ ERREUR : Les services n'ont pas démarré à temps."
          docker compose ps
          exit 1
      - name: Checkout code
        run: docker compose up -d   
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          MONGO_INITDB_DATABASE: ${{ secrets.MONGO_INITDB_DATABASE }}
          MONGO_HOST: ${{ secrets.MONGO_HOST }}
          ME_CONFIG_MONGODB_ADMINUSERNAME: ${{ secrets.ME_CONFIG_MONGODB_ADMINUSERNAME }}
          ME_CONFIG_MONGODB_ADMINPASSWORD: ${{ secrets.ME_CONFIG_MONGODB_ADMINPASSWORD }}
          ME_CONFIG_MONGODB_URL: ${{ secrets.ME_CONFIG_MONGODB_URL }}
         
         
           
    
    
    

    
